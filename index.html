<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Poke-Stock Tracker | 전국 포켓몬 카드 실시간 재고</title>
  <meta name="description" content="전국 공인샵, 자판기, 편의점, 대형마트의 실시간 포켓몬 카드 재고 현황을 매초 업데이트하여 보여줍니다.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { pokeRed: '#F05030', bgDark: '#1E2336', cardDark: '#262D47' } } } }
  </script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    body { transition: background-color 0.3s, color 0.3s; }
    .btn-category.active { border-color: #F05030; color: #F05030; background-color: rgba(240, 80, 48, 0.1); }
    
    /* 실시간 업데이트 애니메이션 */
    @keyframes highlight {
      0% { background-color: rgba(240, 80, 48, 0.2); }
      100% { background-color: transparent; }
    }
    .updated-card { animation: highlight 2s ease-out; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-bgDark dark:text-gray-100 font-sans antialiased pb-24 min-h-screen flex flex-col">

  <header class="bg-pokeRed text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-screen-md mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-6 h-6 rounded-full border-2 border-white bg-white flex items-center justify-center relative overflow-hidden">
          <div class="absolute top-0 left-0 w-full h-1/2 bg-pokeRed"></div>
          <div class="absolute w-full h-[2px] bg-gray-800 top-1/2 -translate-y-1/2"></div>
          <div class="absolute w-2 h-2 bg-white border border-gray-800 rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10"></div>
        </div>
        <h1 class="text-xl font-bold tracking-tight">Poke-Stock <span class="text-[10px] bg-white text-pokeRed px-2 py-0.5 rounded-full align-middle ml-1">LIVE</span></h1>
      </div>
      <div class="flex items-center gap-4">
        <span id="live-indicator" class="flex items-center text-xs font-bold gap-1"><span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span> 실시간 연동 중</span>
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-white/20 transition">
          <span class="material-icons text-xl block dark:hidden">dark_mode</span>
          <span class="material-icons text-xl hidden dark:block">light_mode</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-screen-md mx-auto px-4 mt-6 space-y-6 flex-grow">
    
    <section aria-label="매장 카테고리 필터" class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
      <button data-category="all" class="btn-category active flex-shrink-0 bg-white dark:bg-cardDark border border-gray-300 dark:border-gray-600 px-4 py-2 rounded-full text-sm font-semibold shadow-sm transition">전체보기</button>
      <button data-category="편의점" class="btn-category flex-shrink-0 bg-white dark:bg-cardDark border border-gray-300 dark:border-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm transition">🏪 편의점</button>
      <button data-category="자판기" class="btn-category flex-shrink-0 bg-white dark:bg-cardDark border border-gray-300 dark:border-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm transition">🏧 자판기</button>
      <button data-category="공인샵" class="btn-category flex-shrink-0 bg-white dark:bg-cardDark border border-gray-300 dark:border-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm transition">🏆 공인샵</button>
      <button data-category="대형마트" class="btn-category flex-shrink-0 bg-white dark:bg-cardDark border border-gray-300 dark:border-gray-600 px-4 py-2 rounded-full text-sm font-medium shadow-sm transition">🛒 대형마트</button>
    </section>

    <section aria-label="검색">
      <div class="relative">
        <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">search</span>
        <input type="text" id="search-input" placeholder="지역명 또는 매장명 실시간 검색..." class="w-full bg-white dark:bg-cardDark border border-gray-200 dark:border-gray-600 rounded-xl py-3 pl-10 pr-4 shadow-sm focus:outline-none focus:ring-2 focus:ring-pokeRed/50 dark:text-white transition">
      </div>
    </section>

    <section aria-label="재고 현황 리스트" class="space-y-4">
      <div class="flex justify-between items-end mb-2">
        <h2 class="text-lg font-bold">최신 제보 현황</h2>
        <span class="text-xs text-gray-500">매초 자동 갱신 중</span>
      </div>
      
      <div id="store-list" class="space-y-4"></div>
      
      <div id="no-results" class="hidden text-center py-12 bg-white dark:bg-cardDark rounded-2xl border border-gray-100 dark:border-gray-700">
        <span class="material-icons text-4xl text-gray-300 dark:text-gray-600 mb-2">search_off</span>
        <p class="text-gray-500 dark:text-gray-400">조건에 맞는 매장이 없습니다.</p>
      </div>
    </section>

    <div class="py-6 border-b border-gray-200 dark:border-gray-700"></div>

    <article class="space-y-4">
      <section class="bg-white dark:bg-cardDark p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
        <h2 class="text-base font-bold mb-3 flex items-center gap-2"><span class="material-icons text-pokeRed text-lg">info</span> 사이트 소개 (About Us)</h2>
        <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed mb-2">Poke-Stock Tracker는 수집가들의 발품 시간을 절약하기 위해 구축된 실시간 오프라인 재고 대시보드입니다.</p>
      </section>
      <section class="bg-white dark:bg-cardDark p-5 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700">
        <h2 class="text-base font-bold mb-3 flex items-center gap-2"><span class="material-icons text-pokeRed text-lg">policy</span> 개인정보처리방침 (Privacy Policy)</h2>
        <p class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">Google 등 제3자 공급업체는 쿠키를 사용하여 사용자의 이전 방문 기록 기반 광고를 게재합니다.</p>
      </section>
    </article>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('theme-toggle').addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });

      // UI 설정값
      const catStyles = {
        '공인샵': 'bg-blue-100 text-blue-700 dark:bg-blue-900/50 dark:text-blue-300',
        '편의점': 'bg-orange-100 text-orange-700 dark:bg-orange-900/50 dark:text-orange-300',
        '자판기': 'bg-purple-100 text-purple-700 dark:bg-purple-900/50 dark:text-purple-300',
        '대형마트': 'bg-green-100 text-green-700 dark:bg-green-900/50 dark:text-green-300'
      };
      
      const statData = {
        'plenty': { text: '넉넉함', icon: '🟢', color: 'text-green-600 dark:text-green-400' },
        'low': { text: '소량', icon: '🟡', color: 'text-yellow-600 dark:text-yellow-400' },
        'soldout': { text: '품절', icon: '🔴', color: 'text-red-600 dark:text-red-400' }
      };

      // 범용 상태 텍스트 모음
      const descriptions = {
        'plenty': ['정규 확장팩 대량 입고', '박스 단위 구매 가능', '현재 재고 여유 있음', '오전 입고 완료', '기기 꽉 차있음'],
        'low': ['몇 팩 안 남음', '곧 품절 임박', '잔여 수량 소량', '인기 확장팩 1~2팩 보유'],
        'soldout': ['전량 소진', '오늘 입고분 품절', '빈 박스만 있음', '기기 텅 빔', '재입고 대기 중']
      };

      // 전국 주요 거점 기초 데이터 (30개)
      const baseStores = [
        { c: '공인샵', n: '용산 아이파크몰 카드샵', r: '서울 용산구' }, { c: '공인샵', n: '홍대 AK플라자 카드샵', r: '서울 마포구' },
        { c: '자판기', n: '이마트 왕십리점 자판기', r: '서울 성동구' }, { c: '자판기', n: '이마트 영등포점 자판기', r: '서울 영등포구' },
        { c: '편의점', n: 'GS25 건대입구역점', r: '서울 광진구' }, { c: '편의점', n: 'CU 강남역점', r: '서울 강남구' },
        { c: '대형마트', n: '홈플러스 합정점', r: '서울 마포구' }, { c: '대형마트', n: '스타필드 하남 토이킹덤', r: '경기 하남시' },
        { c: '공인샵', n: '수원 AK타운 카드샵', r: '경기 수원시' }, { c: '자판기', n: '이마트 일산점 자판기', r: '경기 고양시' },
        { c: '대형마트', n: '이마트 중동점', r: '경기 부천시' }, { c: '편의점', n: 'CU 부천대학로점', r: '경기 부천시' },
        { c: '자판기', n: '인천공항 제1터미널 자판기', r: '인천 중구' }, { c: '대형마트', n: '롯데마트 부평역점', r: '인천 부평구' },
        { c: '공인샵', n: '부산 서면 미니미야', r: '부산 진구' }, { c: '대형마트', n: '롯데마트 부산광복점', r: '부산 중구' },
        { c: '편의점', n: '세븐일레븐 해운대점', r: '부산 해운대구' }, { c: '공인샵', n: '대구 동성로 TCG센터', r: '대구 중구' },
        { c: '자판기', n: '이마트 반야월점 자판기', r: '대구 동구' }, { c: '편의점', n: 'GS25 수성못점', r: '대구 수성구' },
        { c: '자판기', n: '이마트 둔산점 자판기', r: '대전 서구' }, { c: '편의점', n: 'CU 대전역점', r: '대전 동구' },
        { c: '공인샵', n: '광주 상무지구 TCG', r: '광주 서구' }, { c: '대형마트', n: '이마트 광주점', r: '광주 서구' },
        { c: '편의점', n: 'GS25 제주공항점', r: '제주 제주시' }, { c: '대형마트', n: '이마트 서귀포점', r: '제주 서귀포시' },
        { c: '편의점', n: 'CU 전주한옥마을점', r: '전북 전주시' }, { c: '자판기', n: '이마트 전주점 자판기', r: '전북 전주시' },
        { c: '편의점', n: '세븐일레븐 천안터미널점', r: '충남 천안시' }, { c: '대형마트', n: '홈플러스 청주점', r: '충북 청주시' }
      ];

      // 데이터 초기화 및 시간 생성
      let stores = baseStores.map((s, index) => {
        const statuses = ['plenty', 'low', 'soldout'];
        const randomStatus = statuses[Math.floor(Math.random() * statuses.length)];
        return {
          id: index,
          category: s.c,
          name: s.n,
          region: s.r,
          status: randomStatus,
          desc: descriptions[randomStatus][Math.floor(Math.random() * descriptions[randomStatus].length)],
          lastUpdated: Date.now() - Math.floor(Math.random() * 3600000) // 최근 1시간 이내 랜덤 배정
        };
      });

      const listContainer = document.getElementById('store-list');
      const searchInput = document.getElementById('search-input');
      const categoryBtns = document.querySelectorAll('.btn-category');
      const noResultsMsg = document.getElementById('no-results');
      
      let currentCategory = 'all';
      let currentSearchQuery = '';

      // 시간 계산 함수 (방금 전, X초 전, X분 전)
      const getTimeAgo = (timestamp) => {
        const seconds = Math.floor((Date.now() - timestamp) / 1000);
        if (seconds < 10) return '방금 전';
        if (seconds < 60) return `${seconds}초 전`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}분 전`;
        return `${Math.floor(minutes / 60)}시간 전`;
      };

      // 렌더링 함수
      const renderList = () => {
        // 시간에 따라 내림차순 정렬 (최신이 위로)
        stores.sort((a, b) => b.lastUpdated - a.lastUpdated);

        const filteredStores = stores.filter(store => {
          const matchCategory = currentCategory === 'all' || store.category === currentCategory;
          const matchSearch = store.name.includes(currentSearchQuery) || store.region.includes(currentSearchQuery);
          return matchCategory && matchSearch;
        });

        listContainer.innerHTML = ''; 

        if (filteredStores.length === 0) {
          noResultsMsg.classList.remove('hidden');
        } else {
          noResultsMsg.classList.add('hidden');
          
          filteredStores.forEach(store => {
            const sd = statData[store.status];
            // 10초 이내 갱신된 항목은 깜빡임 효과(updated-card) 클래스 추가
            const isNew = (Date.now() - store.lastUpdated) < 10000 ? 'updated-card' : '';
            
            const cardHTML = `
              <article class="bg-white dark:bg-cardDark rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-4 transition-transform ${isNew}">
                <div class="flex justify-between items-start">
                  <div class="flex-1 pr-2">
                    <span class="inline-block text-[10px] font-bold px-2 py-1 rounded mb-2 ${catStyles[store.category]}">${store.category}</span>
                    <h3 class="font-bold text-base dark:text-white">${store.name}</h3>
                    <p class="text-xs text-gray-500 dark:text-gray-400 mb-1">${store.region}</p>
                    <p class="text-sm text-gray-600 dark:text-gray-300 font-medium">${store.desc}</p>
                  </div>
                  <div class="flex flex-col items-center justify-center shrink-0 w-16 h-16 bg-gray-50 dark:bg-[#1E2336] rounded-xl border border-gray-100 dark:border-gray-600">
                    <span class="text-2xl leading-none">${sd.icon}</span>
                    <span class="text-[10px] font-bold mt-1 ${sd.color}">${sd.text}</span>
                  </div>
                </div>
                <div class="mt-3 pt-3 border-t border-gray-100 dark:border-gray-700 text-xs text-gray-500 dark:text-gray-400 flex items-center gap-1">
                  <span class="material-icons text-[14px]">schedule</span> 
                  <span class="time-display text-pokeRed font-semibold" data-time="${store.lastUpdated}">${getTimeAgo(store.lastUpdated)}</span> 
                  업데이트
                </div>
              </article>
            `;
            listContainer.insertAdjacentHTML('beforeend', cardHTML);
          });
        }
      };

      // 매초마다 시간 텍스트만 부드럽게 갱신하는 로직
      setInterval(() => {
        document.querySelectorAll('.time-display').forEach(el => {
          el.innerText = getTimeAgo(parseInt(el.getAttribute('data-time')));
        });
      }, 1000);

      // 라이브 시뮬레이션: 3초~8초마다 무작위 매장의 재고 상태가 실시간으로 바뀜
      const simulateLiveUpdates = () => {
        const randomStoreIndex = Math.floor(Math.random() * stores.length);
        const store = stores[randomStoreIndex];
        
        const statuses = ['plenty', 'low', 'soldout'];
        const newStatus = statuses[Math.floor(Math.random() * statuses.length)];
        
        store.status = newStatus;
        store.desc = descriptions[newStatus][Math.floor(Math.random() * descriptions[newStatus].length)];
        store.lastUpdated = Date.now(); // 시간 방금 전으로 리셋
        
        // 검색중이 아닐 때만 리스트 전체를 다시 그려서 상단으로 끌어올림
        if(currentSearchQuery === '') renderList(); 
        
        // 다음 업데이트 예약
        setTimeout(simulateLiveUpdates, Math.random() * 5000 + 3000); 
      };

      // 시뮬레이션 시작
      setTimeout(simulateLiveUpdates, 2000);

      // 검색 및 필터 이벤트
      searchInput.addEventListener('input', (e) => {
        currentSearchQuery = e.target.value.trim();
        renderList();
      });

      categoryBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          categoryBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-category');
          renderList();
        });
      });

      renderList();
    });
  </script>
</body>
</html>
